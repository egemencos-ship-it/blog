<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecoskun><title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    /* foto css */
    .hero-bg {
      position: relative;
      overflow: hidden;
      background: linear-gradient(-45deg, #667eea, #764ba2, #6b8dd6, #8e44ad);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: white;
      padding: 5rem 1rem;
      text-align: center;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    
    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none; 
    }

    
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
    }

    
    .profile-photo {
      width: 150px;
      height: 150px;
      border: 4px solid white;
      border-radius: 9999px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin: 0 auto 1.5rem;
      display: block;
    }

    .social-icons:hover {
      transform: scale(1.1);
      transition: transform 0.3s ease;
    }
    .social-icons {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.social-icons:hover {
  transform: scale(1.15) rotate(10deg);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

    
    
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- foto  -->
  <header class="hero-bg">
    
    <div id="particles-js"></div>

    <div class="hero-content">
      <img
        src="oguz.jpg"
        alt="Profil fotoğrafı"
        class="profile-photo"
      />
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-4">
        Egemen Coşkun
      </h1>
      <p class="text-xl md:text-2xl mb-6">
        Junior Developer | Learning & Building
      </p>
      <p class="text-lg max-w-2xl mx-auto px-4">
        Ben Egemek Coşkun Selam! Ben Egemen Coşkun Trakya Üniversitesi’nde Yazılım Geliştirme okuyorum.Özellikle web
        geliştirmeye meraklıyım.Şimdilik küçük projelerle uğraşıp kendimi geliştirmeye çalışıyorum.Amacım, yazılım alanında tecrübe kazanıp 
        ülkeme faydalı işler yapabilmek.Burada hem kendimden biraz bahsediyorum hem de sosyal medya hesaplarımı paylaşıyorum. 
        Sohbet etmek, fikir alışverişi yapmak ya da sadece selam vermek istersen bana her zaman ulaşabilirsin 
      </p>
    </div>
  </header>

  <!-- hesaplar -->
  <section class="py-16 bg-gray-100">
    <div class="container mx-auto px-4 text-center">
      <h2 class="text-3xl font-semibold mb-8">Sosyal Medya Hesaplarım</h2>
      <p class="text-lg mb-6">
        Sosyal Medya Hesaplarım:
      </p>
      
    </div>
  </section>

  <!-- alt -->
  <footer class="bg-gray-800 text-white py-8">
    <div class="container mx-auto px-4 text-center">
      <p>© 2025  Egemen Coşkun. Tüm hakları saklıdır.</p>
      <p class="mt-2">İletişim: <a href="mailto:sevikoguzrahmet@gmail.com" class="hover:underline"</a> | Telefon: </p>
    </div>
  </footer>

 
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    
    particlesJS("particles-js", {
      "particles": {
        "number": {
          "value": 100,
          "density": {
            "enable": true,
            "value_area": 800
          }
        },
        "color": {
          "value": "#ffffff"
        },
        "shape": {
          "type": "circle"
        },
        "opacity": {
          "value": 0.5,
          "random": true
        },
        "size": {
          "value": 3,
          "random": true
        },
        "move": {
          "enable": true,
          "speed": 1,
          "direction": "none",
          "random": true,
          "straight": false,
          "out_mode": "out"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": {
            "enable": true,
            "mode": "grab"
          },
          "onclick": {
            "enable": true,
            "mode": "push"
          }
        },
        "modes": {
          "grab": {
            "distance": 140,
            "line_linked": {
              "opacity": 0.5
            }
          },
          "push": {
            "particles_nb": 4
          }
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
